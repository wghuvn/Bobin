plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

// Automatically clean up retired/removed files if this archive was extracted over an older directory
def retiredFiles = [
    // Replaced by direct, finally-scoped project-owned observation during stabilization.
    'src/main/java/com/bobincraft/mixin/RefineryBlueprintScopeMixin.java',
    'src/main/java/com/bobincraft/mixin/RefineryGeneratedCellMixin.java',
    'src/main/java/com/bobincraft/camera/BobinCameraState.java',
    'src/main/java/com/bobincraft/input/ControlMath.java',
    'src/main/java/com/bobincraft/input/RaycastHelper.java',
    'src/main/java/com/bobincraft/mixin/ChunkRendererRegionMixin.java',
    'src/main/java/com/bobincraft/mixin/EntityRenderDispatcherMixin.java',
    'src/main/java/com/bobincraft/movement/BobinMovementController.java',
    'src/main/java/com/bobincraft/movement/PathFinder.java',
    'src/main/java/com/bobincraft/render/BuildingCutawayManager.java',
    'src/main/java/com/bobincraft/render/FogOfWarManager.java',
    'src/main/java/com/bobincraft/render/FoliageCutawayManager.java',
    'src/main/java/com/bobincraft/render/WorldRenderHandler.java',
    'src/main/java/com/bobincraft/screen/BobinScreen.java',
    'src/main/java/com/bobincraft/siege/SiegeManager.java',
    'src/main/java/com/bobincraft/weapon/BobinWeaponHandler.java',
    'src/main/java/com/bobincraft/weapon/GunItem.java',
    'src/main/java/com/bobincraft/weapon/GunServer.java',
    'src/main/java/com/bobincraft/weapon/GunType.java',
    'src/main/java/com/bobincraft/weapon/SniperRifleItem.java',
    'src/main/java/com/bobincraft/weapon/WeaponStats.java',
    'src/main/resources/assets/bobin_craft/models/item/breacher.json',
    'src/main/resources/assets/bobin_craft/models/item/cryo_carbine.json',
    'src/main/resources/assets/bobin_craft/models/item/medic_gun.json',
    'src/main/resources/assets/bobin_craft/models/item/sniper_rifle.json',
    'src/main/resources/assets/bobin_craft/models/item/spotter.json',
    'src/main/resources/assets/bobin_craft/textures/item/breacher.png',
    'src/main/resources/assets/bobin_craft/textures/item/cryo_carbine.png',
    'src/main/resources/assets/bobin_craft/textures/item/gun_parts.png',
    'src/main/resources/assets/bobin_craft/textures/item/medic_gun.png',
    'src/main/resources/assets/bobin_craft/textures/item/sniper_rifle.png',
    'src/main/resources/assets/bobin_craft/textures/item/spotter.png',
    'src/main/resources/data/bobin_craft/recipes/breacher.json',
    'src/main/resources/data/bobin_craft/recipes/cryo_carbine.json',
    'src/main/resources/data/bobin_craft/recipes/medic_gun.json',
    'src/main/resources/data/bobin_craft/recipes/sniper_rifle.json',
    'src/main/resources/data/bobin_craft/recipes/spotter.json',
    'src/test/java/com/bobincraft/input/ControlMathTest.java',
    'src/test/java/com/bobincraft/weapon/WeaponTimingTest.java'
]
retiredFiles.each { path ->
    def f = file(path)
    if (f.exists()) {
        f.delete()
    }
}

sourceSets {
    main {
        java {
            exclude 'com/bobincraft/camera/BobinCameraState.java',
                    'com/bobincraft/input/**',
                    'com/bobincraft/mixin/ChunkRendererRegionMixin.java',
                    'com/bobincraft/mixin/EntityRenderDispatcherMixin.java',
                    'com/bobincraft/movement/**',
                    'com/bobincraft/render/**',
                    'com/bobincraft/screen/**',
                    'com/bobincraft/siege/**',
                    'com/bobincraft/weapon/BobinWeaponHandler.java',
                    'com/bobincraft/weapon/GunItem.java',
                    'com/bobincraft/weapon/GunServer.java',
                    'com/bobincraft/weapon/GunType.java',
                    'com/bobincraft/weapon/SniperRifleItem.java',
                    'com/bobincraft/weapon/WeaponStats.java'
        }
    }
    test {
        java {
            exclude 'com/bobincraft/input/**',
                    'com/bobincraft/weapon/WeaponTimingTest.java'
        }
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

// Explicitly include every runtime Java library; Loom include is not transitive.
// Shared version pins also drive the independent CPU-only loader test harness.
apply from: 'gradle/armament-libraries.gradle'
dependencies {
    armamentLibraryCoordinates.each { include it }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    useJUnitPlatform()
    maxHeapSize = '1G'
}

// Explicit, separate integration harness. gradle test does not run Fabric GameTest.
loom {
    runs {
        glbDebugClient {
            client()
            name "Bobin static GLB diagnostic"
            vmArg "-Dbobin.armament.glbDebug=true"
            runDir "build/glb-debug-client"
        }
        gametest {
            server()
            name "Bobin stabilization GameTest"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/gametest-results.xml"
            runDir "build/gametest"
        }
    }
}

// An explicit CPU-only verification target, not a replacement for the Fabric build.
plugins { id 'java' }
repositories { mavenCentral() }
def bobinRoot = file('../..')
apply from: new File(bobinRoot, 'gradle/armament-libraries.gradle')
dependencies {
    implementation 'com.google.code.gson:gson:2.10'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
sourceSets {
    main {
        java {
            srcDirs = [new File(bobinRoot, 'src/main/java/com/bobincraft/armament')]
            exclude 'client/render/fabric/**', 'client/resource/fabric/**', 'client/debug/**', 'client/ArmamentGlbClient.java'
        }
        resources.srcDirs = [new File(bobinRoot, 'src/main/resources')]
    }
    test {
        java.srcDirs = [new File(bobinRoot, 'src/test/java/com/bobincraft/armament')]
        resources.srcDirs = [new File(bobinRoot, 'src/test/resources')]
    }
}
test {
    useJUnitPlatform()
    workingDir bobinRoot
    jvmArgs '-Djava.awt.headless=true'
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
tasks.register('dependencyReport') {
    doLast {
        def rows = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            [coordinate: it.moduleVersion.id.toString(), file: it.file.name,
             sha256: java.security.MessageDigest.getInstance('SHA-256').digest(it.file.bytes).encodeHex().toString()]
        }
        file("${buildDir}/dependencies.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(rows))
    }
}
